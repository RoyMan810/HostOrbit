[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-orbit"
version = "0.1.0.dev1"
description = "Self-hosted infrastructure Controller"
requires-python = ">=3.13"
dependencies = ["fastapi==0.162.4", "uvicorn==0.54.0", "argon2-cffi==25.1.0", "PyNaCl==1.6.2", "asyncssh==2.24.1"]

[project.scripts]
vpn-orbit = "vpn_orbit.cli:main"
vpn-orbit-runtime = "vpn_orbit.runtime.cli:main"
vpn-orbit-backup = "vpn_orbit.runtime.backup_cli:main"
vpn-orbit-rescue = "vpn_orbit.runtime.rescue_cli:main"
vpn-orbit-activate = "vpn_orbit.runtime.activation_cli:main"

[tool.setuptools.packages.find]
include = ["vpn_orbit*"]

[tool.setuptools.package-data]
vpn_orbit = ["release-manifest.json", "schema_v1.sql"]

[tool.ruff]
required-version = "==0.17.4"
target-version = "py313"

[tool.ruff.lint]
# Correctness checks without rewriting the accepted Foundation source.
select = ["E9", "F63", "F7", "F82"]
