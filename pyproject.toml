[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hostorbit"
version = "0.1.0.dev1"
description = "Self-hosted infrastructure Controller"
requires-python = ">=3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "argon2-cffi==25.1.0"]

[project.scripts]
hostorbit = "hostorbit.cli:main"

[tool.setuptools.packages.find]
include = ["hostorbit*"]

[tool.setuptools.package-data]
hostorbit = ["release-manifest.json"]
