name: Regenerate standalone installer (temporary PR helper)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/app-version-0-1-0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - run: python3 tools/build_bundle.py
      - name: Commit generated installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kvpn-install.sh
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate bundled installer for v0.1.0'
            git push origin HEAD:${{ github.head_ref }}
          fi
