name: Branch maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: branch-maintenance
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'RoyMan810/HostOrbit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify the maintenance guard
        run: python -m unittest discover -s tests_tools -p test_branch_maintenance.py -v
      - name: Remove unchanged merged temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prune_merged_branches.py --apply
