name: Branch maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: branch-maintenance
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'RoyMan810/HostOrbit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify the maintenance guard
        run: python -m unittest discover -s tests_tools -p test_branch_maintenance.py -v
      - name: Remove unchanged merged temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prune_merged_branches.py --apply
