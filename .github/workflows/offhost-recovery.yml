name: HostOrbit recovery after source VM loss

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/offhost-recovery.yml
      - requirements-lab.txt
      - stage0/**
      - tests/lab/delayed_container.py
      - tests/lab/docker_late_effect.py
      - tests/lab/fencing_vm.py
      - tests/lab/ssh-profile.sh
      - tests/lab/ssh_restart_fixture.py
      - tests/lab/ssh_systemd_docker.py
      - tests/lab/offhost_recovery.py
      - tests/lab/sftp_publication.py
  pull_request:
    paths:
      - .github/workflows/offhost-recovery.yml
      - requirements-lab.txt
      - stage0/**
      - tests/lab/delayed_container.py
      - tests/lab/docker_late_effect.py
      - tests/lab/fencing_vm.py
      - tests/lab/ssh-profile.sh
      - tests/lab/ssh_restart_fixture.py
      - tests/lab/ssh_systemd_docker.py
      - tests/lab/offhost_recovery.py
      - tests/lab/sftp_publication.py
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSTORBIT_LAB_DOCKER_VERSION: "29.9.3"
  HOSTORBIT_LAB_PYTHON_IMAGE: docker.io/library/python@sha256:f3dac913ab53b78c64f26d5518fcd7043d5a1a46522d6a493b598c3ed12f62a6

jobs:
  restore:
    name: Portable Vault and pending Docker effect after source VM loss
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v${{ env.HOSTORBIT_LAB_DOCKER_VERSION }}
          set-host: true
      - name: Install QEMU and the SFTP lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso netcat-openbsd openssh-server
      - name: Prepare the pinned guest image and lab dependencies
        shell: bash
        run: |
          lab="$RUNNER_TEMP/hostorbit-offhost"
          mkdir -p "$lab"
          cd "$lab"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 2 \
            -o ubuntu.qcow2 https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
          echo '04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94  ubuntu.qcow2' | sha256sum -c -
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 2 \
            -o age.tar.gz 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz?download=1'
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz' | sha256sum -c -
          tar --no-same-owner -xzf age.tar.gz -- age/age age/age-keygen
          python -m pip install --only-binary=:all: --target "$lab/deps" -r "$GITHUB_WORKSPACE/requirements-lab.txt"
      - name: Fence the source guest while the Docker effect is pending
        run: |
          lab="$RUNNER_TEMP/hostorbit-offhost"
          test "$(docker version --format '{{.Server.Version}}')" = "$HOSTORBIT_LAB_DOCKER_VERSION"
          sudo -n /usr/bin/env "PATH=$lab/age:$PATH" "PYTHONPATH=$PWD:$lab/deps" PYTHONDONTWRITEBYTECODE=1 \
            "HOSTORBIT_LAB_PYTHON=$(command -v python)" \
            "HOSTORBIT_LAB_DOCKER_HOST=$DOCKER_HOST" "HOSTORBIT_LAB_PYTHON_IMAGE=$HOSTORBIT_LAB_PYTHON_IMAGE" \
            /usr/bin/bash tests/lab/ssh-profile.sh --isolated-vm --controller-loss "$lab"
