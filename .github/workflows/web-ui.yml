name: VPN-Orbit WebUI

on:
  pull_request:
    paths: &web_paths
      - 'web/**'
      - 'vpn_orbit/**'
      - 'requirements-*.txt'
      - '.github/workflows/web-ui.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths: *web_paths

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: WebUI / build and HTTPS browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: npm install --global npm@12.2.2
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Test in the runner's Chrome
        working-directory: web
        run: |
          browser="$(command -v google-chrome)"
          "$browser" --version
          VPN_ORBIT_CHROMIUM="$browser" npm test
      - name: Package the tested WebUI
        shell: bash
        run: |
          test -s web/dist/index.html
          output="$RUNNER_TEMP/vpn-orbit-webui"
          mkdir "$output"
          git rev-parse HEAD > "$output/source-commit.txt"
          tar -czf "$output/webui.tar.gz" -C web/dist .
          cd "$output"
          sha256sum webui.tar.gz > SHA256SUMS
      - name: Publish the WebUI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpn-orbit-webui-${{ github.sha }}
          path: ${{ runner.temp }}/vpn-orbit-webui/
          if-no-files-found: error
