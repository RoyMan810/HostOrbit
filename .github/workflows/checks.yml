name: Installer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check standalone installer matches sources
        run: |
          python3 tools/build_bundle.py --check
      - name: Check Bash syntax
        shell: bash
        run: |
          bash -n install.sh kvpn-install.sh lib/common.sh lib/tui.sh lib/backup-node.sh lib/textual_protocol.sh lib/textual_launcher.sh
          bash -n monitor-kit/install.sh monitor-kit/lib/sender.sh
      - name: Check Python syntax
        run: |
          python3 -m py_compile monitor-kit/lib/monitor.py monitor-kit/lib/receiver.py monitor-kit/lib/register.py monitor-kit/lib/verify_host_key.py lib/textual_ui.py tools/build_bundle.py
      - name: Exercise the single-file installer (read-only)
        run: |
          bash kvpn-install.sh help
          test "$(bash kvpn-install.sh help | grep -c 'interactive menu')" -ge 1
      - name: Install Textual for headless UI smoke tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/kvpn-textual-venv"
          "$RUNNER_TEMP/kvpn-textual-venv/bin/python" -m pip install --disable-pip-version-check --quiet 'textual==8.2.8'
      - name: Run unit tests
        run: |
          "$RUNNER_TEMP/kvpn-textual-venv/bin/python" -m unittest discover -s tests -v
          python3 -m unittest discover -s monitor-kit/tests -v
