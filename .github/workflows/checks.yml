name: HostOrbit Stage 0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSTORBIT_LAB_PYTHON_IMAGE: docker.io/library/python@sha256:f3dac913ab53b78c64f26d5518fcd7043d5a1a46522d6a493b598c3ed12f62a6

jobs:
  prototypes:
    name: Stage 0 prototypes / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lab.txt
      - name: Install verified age release
        shell: bash
        run: |
          age_dir="$RUNNER_TEMP/hostorbit-age"
          mkdir -p "$age_dir"
          cd "$age_dir"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 2 \
            -o age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz' | sha256sum -c -
          tar --no-same-owner -xzf age.tar.gz -- age/age age/age-keygen
          echo "$age_dir/age" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v

  broker-containers:
    name: Broker peer credentials / Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Worker, Backend and stranger access
        run: bash tests/lab/broker-containers.sh

  restricted-ssh:
    name: Restricted SSH account / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OpenSSH server if absent
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
      - name: Exercise the restricted account
        run: sudo bash tests/lab/ssh-profile.sh --isolated-vm

  docker-late-effect:
    name: Delegated restart effect / Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Kill the client and observe the pending Docker restart
        run: PYTHONPATH=. python tests/lab/docker_late_effect.py
