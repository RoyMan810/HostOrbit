name: HostOrbit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOSTORBIT_LAB_DOCKER_VERSION: "29.9.3"
  HOSTORBIT_LAB_PYTHON_IMAGE: docker.io/library/python@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
  HOSTORBIT_INSTALL_PYTHON_IMAGE: docker.io/library/python@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928

jobs:
  quality:
    name: Repository quality / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - run: python -m pip install -r requirements-quality.txt
      - run: ruff check .
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests_tools -v

  time-health:
    name: Stage 1 host TimeHealth / ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [chrony, timesyncd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install fixed application dependencies and the selected host time daemon
        env:
          TIME_SOURCE: ${{ matrix.source }}
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          if test "$TIME_SOURCE" = chrony; then
            sudo apt-get install -y --no-install-recommends chrony
          else
            sudo apt-get install -y --no-install-recommends systemd-timesyncd
          fi
      - name: Verify actual daemon telemetry, protected IPC and kernel clock-step recovery
        env:
          TIME_SOURCE: ${{ matrix.source }}
        run: |
          sudo -n /usr/bin/env "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$(command -v python)" tests_runtime/lab/time_health.py --isolated-vm --source "$TIME_SOURCE"

  installation:
    name: Stage 1 signed fresh installation / systemd and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v${{ env.HOSTORBIT_LAB_DOCKER_VERSION }}
          set-host: true
      - name: Install fixed builder dependencies and generate an ephemeral lab signer
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2
          python - <<'PY'
          import os, pathlib
          from nacl.signing import SigningKey
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          signer = SigningKey.generate()
          (root / "hostorbit-lab-signer.seed").write_bytes(bytes(signer))
          (root / "hostorbit-lab-signer.seed").chmod(0o600)
          (root / "hostorbit-lab-signer.pub").write_bytes(bytes(signer.verify_key))
          PY
      - name: Build the signed wheel bundle without placing its private signer inside
        run: |
          age_dir="$RUNNER_TEMP/hostorbit-install-age"
          mkdir -p "$age_dir"
          python "$GITHUB_WORKSPACE/tools/fetch_age.py" --output "$age_dir/age.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $age_dir/age.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$age_dir/age.tar.gz" -C "$age_dir" -- age/age age/age-keygen
          python_image="$HOSTORBIT_INSTALL_PYTHON_IMAGE"
          docker pull "$python_image"
          docker run --rm --network none "$python_image" python -c 'import sys,sqlite3; print(sys.version); print(sqlite3.sqlite_version); assert sys.version_info[:2]==(3,15) and sqlite3.sqlite_version_info>=(3,45)'
          python deploy/build_bundle.py --output "$RUNNER_TEMP/hostorbit-install-bundle" \
            --signing-key "$RUNNER_TEMP/hostorbit-lab-signer.seed" \
            --python-image "$python_image" --age-tool "$age_dir/age/age"
      - name: Install and verify the actual host services and container namespaces
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" tests_runtime/lab/installation.py --isolated-vm \
            --bundle "$RUNNER_TEMP/hostorbit-install-bundle" --trust-key "$RUNNER_TEMP/hostorbit-lab-signer.pub" \
            --docker-host "$DOCKER_HOST"

  foundation:
    name: Stage 1 Auth, RBAC and Audit / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify authentication boundaries and atomic audit delivery
        run: |
          age_dir="$RUNNER_TEMP/hostorbit-runtime-age"
          mkdir -p "$age_dir"
          python "$GITHUB_WORKSPACE/tools/fetch_age.py" --output "$age_dir/age.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $age_dir/age.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$age_dir/age.tar.gz" -C "$age_dir" -- age/age age/age-keygen
          export HOSTORBIT_TEST_AGE_DIR="$age_dir/age"
          python -m unittest discover -s tests_app -v
          python -m unittest discover -s tests_runtime -v
      - name: Exercise Controller SFTP publication against OpenSSH
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo -n /usr/bin/env "PATH=$PATH" "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" tests/lab/runtime_sftp_publication.py --isolated-vm
      - name: Build the Controller package and check its manifest
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/hostorbit-wheels" .
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          wheel, = pathlib.Path(os.environ["RUNNER_TEMP"], "hostorbit-wheels").glob("hostorbit-*.whl")
          with zipfile.ZipFile(wheel) as archive:
              manifest = json.loads(archive.read("hostorbit/release-manifest.json"))
              assert manifest["remote_mutation_enabled"] is False
              assert hashlib.sha256(archive.read("hostorbit/schema_v1.sql")).hexdigest() == "825d6b23d2ac197fa0e62fd7a649ce8563ef84a5f0cdee3135817dd619894db3"
              assert not any(name.startswith(("stage0/", "tests/", "tests_app/")) for name in archive.namelist())
          PY

  isolated-runtime:
    name: Stage 1 process boundary / Linux UIDs and SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install fixed application dependencies and SSH tools
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2 sudo
      - name: Verify isolated API, Worker, Broker and authority with a real managed SSH namespace
        run: |
          sudo -n /usr/bin/env "PATH=$PATH" "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$(command -v python)" tests_runtime/lab/runtime_boundary.py --isolated-vm

  prototypes:
    name: Stage 0 prototypes / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lab.txt
      - name: Install verified age release
        shell: bash
        run: |
          age_dir="$RUNNER_TEMP/hostorbit-age"
          mkdir -p "$age_dir"
          cd "$age_dir"
          python "$GITHUB_WORKSPACE/tools/fetch_age.py" --output age.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz' | sha256sum -c -
          tar --no-same-owner -xzf age.tar.gz -- age/age age/age-keygen
          echo "$age_dir/age" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - name: Validate accepted Stage0 and Stage1 evidence and retain the MVP release block
        run: |
          registry=evidence/acceptance/stage0-2026-11-07/HostOrbit_Requirements_Registry_v2.3.json
          python -m stage0.requirements "$registry" --gate Stage0 --evidence-root .
          python -m stage0.requirements "$registry" --gate Stage1 --evidence-root .
          python - <<'PY'
          from pathlib import Path
          from stage0.requirements import _read_json, validate
          path = Path("evidence/acceptance/stage0-2026-11-07/HostOrbit_Requirements_Registry_v2.3.json")
          registry = validate(_read_json(path))
          assert registry.blockers("Stage3", Path(".")), "MVP must remain blocked until all its AC pass"
          PY
      - name: Install OpenSSH server if absent
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
      - name: Exercise SFTP publication and recovery
        run: |
          sudo -n /usr/bin/env "PATH=$PATH" "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" tests/lab/sftp_publication.py --isolated-vm

  broker-containers:
    name: Broker peer credentials / Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v${{ env.HOSTORBIT_LAB_DOCKER_VERSION }}
          set-host: true
      - name: Verify Worker, Backend and stranger access
        run: |
          test "$(docker version --format '{{.Server.Version}}')" = "$HOSTORBIT_LAB_DOCKER_VERSION"
          bash tests/lab/broker-containers.sh
      - name: Verify scoped discovery against the pinned Docker daemon
        run: |
          sudo -n /usr/bin/env "PATH=$PATH" "DOCKER_HOST=$DOCKER_HOST" GITHUB_ACTIONS=true \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" python3 tests_runtime/lab/docker_discovery.py \
            --isolated-vm --image "$HOSTORBIT_LAB_PYTHON_IMAGE"

  restricted-ssh:
    name: Restricted SSH account / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSH server if absent
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
      - name: Exercise the restricted account
        run: sudo bash tests/lab/ssh-profile.sh --isolated-vm

  docker-late-effect:
    name: Delegated restart effect / SSH, systemd and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v${{ env.HOSTORBIT_LAB_DOCKER_VERSION }}
          set-host: true
      - name: Kill the SSH client and transient cgroup, then observe the Docker daemon
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          test "$(docker version --format '{{.Server.Version}}')" = "$HOSTORBIT_LAB_DOCKER_VERSION"
          sudo -n /usr/bin/env "HOSTORBIT_LAB_DOCKER_HOST=$DOCKER_HOST" \
            "HOSTORBIT_LAB_PYTHON_IMAGE=$HOSTORBIT_LAB_PYTHON_IMAGE" \
            /usr/bin/bash tests/lab/ssh-profile.sh --isolated-vm --docker-chain
